[package]
name = "msl-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Optional native Markdown minification for Maintainer Skills Lab"
license = "MIT"

[lib]
name = "msl_core"
crate-type = ["cdylib"]

[dependencies]
ignore = "=0.4.23"
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py311"] }
tiktoken-rs = { version = "=0.6.0", default-features = false }
tree-sitter = "=0.24.7"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.23.1"
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "=0.23.2"
tree-sitter-typescript = "=0.23.2"
