<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Maintainer Skills Lab — Useful skills. One shared source.</title>
  <desc id="desc">Maintainer and writing workflows for Codex, Claude Code, Cursor, and Grok Bot. Markdown sources generate native client files and Grok Bot setup recipes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#192b36"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#344651" stroke-width=".5" opacity=".35"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect x="680" width="520" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="48" y="44" width="28" height="28" rx="7" fill="#bced85"/>
    <path d="M55 63V52l7 7 7-7v11" stroke="#101923" stroke-width="2" fill="none"/>
    <text x="90" y="64" fill="#e7edf2" font-size="15" font-weight="700" letter-spacing="2">MAINTAINER SKILLS LAB</text>
    <text x="46" y="158" fill="#f3f6f3" font-size="66" font-weight="700" letter-spacing="-2">Useful skills.</text>
    <text x="46" y="231" fill="#bced85" font-size="66" font-weight="700" letter-spacing="-2">One shared source.</text>
    <text x="49" y="285" fill="#b5c4ce" font-size="21">Reproduce bugs. Review changes. Write clearly.</text>
    <path d="M49 320H648" stroke="#3a4b57"/>
    <text x="49" y="362" fill="#e7edf2" font-size="16">Codex</text>
    <text x="127" y="362" fill="#60727c" font-size="16">/</text>
    <text x="152" y="362" fill="#e7edf2" font-size="16">Claude Code</text>
    <text x="275" y="362" fill="#60727c" font-size="16">/</text>
    <text x="300" y="362" fill="#e7edf2" font-size="16">Cursor</text>
    <text x="378" y="362" fill="#60727c" font-size="16">/</text>
    <text x="403" y="362" fill="#e7edf2" font-size="16">Grok Bot</text>
    <g transform="translate(815 91)">
      <rect width="330" height="274" rx="16" fill="#0d151e" stroke="#4a5c67"/>
      <circle cx="22" cy="23" r="4" fill="#bced85"/>
      <circle cx="37" cy="23" r="4" fill="#637683"/>
      <circle cx="52" cy="23" r="4" fill="#637683"/>
      <text x="302" y="28" text-anchor="end" fill="#8299a7" font-size="12">SKILL.md</text>
      <path d="M0 46H330" stroke="#34444f"/>
      <text x="24" y="87" fill="#bced85" font-size="14" font-family="Menlo,Consolas,monospace">name: mkl-humanize</text>
      <text x="24" y="119" fill="#d4dfe6" font-size="16">Keep the facts.</text>
      <text x="24" y="146" fill="#d4dfe6" font-size="16">Keep the author's voice.</text>
      <text x="24" y="173" fill="#d4dfe6" font-size="16">Make every sentence useful.</text>
      <rect x="24" y="204" width="282" height="43" rx="8" fill="#20342c"/>
      <text x="42" y="231" fill="#bced85" font-size="13" font-family="Menlo,Consolas,monospace">$ python3 tools/kit.py sync</text>
    </g>
    <text x="1144" y="405" text-anchor="end" fill="#879dab" font-size="12" letter-spacing="1">OPEN SOURCE · MIT</text>
  </g>
</svg>
